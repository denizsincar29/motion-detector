name: deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # No build here — the server builds from source. This is the point:
      # rebuild.sh already knows the Caddy site root, so the artifact that
      # lands on the server is exactly the one that gets served. SCP'ing
      # built files to a guessed path is how the site ended up stale.
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: denizsincar29
          key: ${{ secrets.KEY }}
          script: |
            export PATH="$HOME/.cargo/bin:$PATH"
            cd ~/motion-detector
            git pull --ff-only
            ./rebuild.sh
